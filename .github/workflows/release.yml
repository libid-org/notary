name: Release

# Publishing a GitHub Release tagged `v<version>` or `v<version>-rc.N` produces
# the two release artifacts:
#
#   * a Docker image pushed to ghcr.io/libid-org/notary:<version> (`:latest`
#     only for a final release), as one manifest list covering linux/amd64 and
#     linux/arm64;
#   * a tlsn_wasm browser bundle (built from the exact tlsn rev Cargo.lock
#     pins) uploaded to the release as tlsn-wasm-<version>.tar.gz.
#
# The Rust checks re-run here first — a release must not outrun a red main.
# Every third-party action is pinned by commit SHA, with the tag in a comment.

on:
  release:
    types: [published]

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.97.1
  NIGHTLY: nightly-2026-08-10
  IMAGE: ghcr.io/${{ github.repository_owner }}/notary

jobs:
  # The tag names the version the manifest already carries, optionally with an
  # RC suffix — the tag is a pointer, never a source. Everything that publishes
  # needs this first.
  verify-tag:
    name: Release tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches Cargo.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          version_regex="${version//./\\.}"
          if [[ "$TAG" != "v$version" && ! "$TAG" =~ ^v${version_regex}-rc\.[1-9][0-9]*$ ]]; then
            echo "::error::release tag '$TAG' does not match 'v$version' or 'v$version-rc.N'"
            exit 1
          fi
          echo "Tag $TAG matches Cargo.toml."

  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting (nightly rustfmt)
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

  # Each platform compiles on a runner of its own architecture and pushes an
  # untagged image addressed only by digest; `docker-manifest` then joins the
  # digests under the release tags. QEMU is deliberately not used: emulating a
  # tlsn/mpz build costs hours, while `ubuntu-24.04-arm` is native and free for
  # this public repo.
  docker:
    name: Docker image ${{ matrix.platform }} → ghcr.io
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: [verify-tag, checks]
    strategy:
      # One architecture failing should not hide whether the other one builds.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # The default `docker` driver cannot push by digest; a container
          # builder can, and still compiles natively on this runner.
          docker buildx create --name notary --driver docker-container --use
          # oci-mediatypes=false keeps the classic Docker manifest list this
          # repo has always published: `docker manifest inspect` before Docker
          # 23 cannot read an OCI index, and nothing here needs one.
          # No provenance/SBOM attestations: they would ride along as extra
          # manifests with platform unknown/unknown, and a release tag's
          # contract is exactly two platform entries.
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=false \
            --sbom=false \
            --metadata-file metadata.json \
            --output "type=image,name=$IMAGE,oci-mediatypes=false,push-by-digest=true,name-canonical=true,push=true" \
            .
          mkdir -p digests
          jq -er '."containerimage.digest"' metadata.json > "digests/$ARCH"
          echo "$PLATFORM $(cat "digests/$ARCH")"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker manifest list → ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the per-platform digests under the release tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sources=()
          for f in digests/*; do sources+=("$IMAGE@$(cat "$f")"); done
          docker buildx imagetools create -t "$IMAGE:$version" "${sources[@]}"
          if [ "$PRERELEASE" = "false" ]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$version"
          fi
          docker buildx imagetools inspect "$IMAGE:$version"

  tlsn-wasm:
    name: tlsn_wasm bundle → release asset
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [verify-tag, checks]
    permissions:
      # Uploading a release asset is a contents write.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the bundle at the Cargo.lock tlsn rev
        run: ./scripts/build-tlsn-wasm.sh --out tlsn-wasm

      - name: Pack
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tar -czf "tlsn-wasm-$version.tar.gz" -C tlsn-wasm \
            tlsn_wasm.js tlsn_wasm_bg.wasm snippets
          sha256sum "tlsn-wasm-$version.tar.gz"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: tlsn-wasm-*.tar.gz
