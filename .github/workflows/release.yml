name: Release

# Publishing a GitHub Release tagged `v<version>` produces the two release
# artifacts:
#
#   * a Docker image pushed to ghcr.io/libid-org/notary:<version> and :latest;
#   * a tlsn_wasm browser bundle (built from the exact tlsn rev Cargo.lock
#     pins) uploaded to the release as tlsn-wasm-<version>.tar.gz.
#
# The Rust checks re-run here first — a release must not outrun a red main.
# Every third-party action is pinned by commit SHA, with the tag in a comment.

on:
  release:
    types: [published]

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: 1.97.1
  NIGHTLY: nightly-2026-08-10
  IMAGE: ghcr.io/${{ github.repository_owner }}/notary

jobs:
  # The tag names the version the manifest already carries — the tag is a
  # pointer, never a source. Everything that publishes needs this first.
  verify-tag:
    name: Release tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag equals Cargo.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match Cargo.toml version 'v$version'"
            exit 1
          fi
          echo "Tag $TAG matches Cargo.toml."

  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting (nightly rustfmt)
        run: cargo +"$NIGHTLY" fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

  docker:
    name: Docker image → ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [verify-tag, checks]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          docker build -t "$IMAGE:$version" -t "$IMAGE:latest" .
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"

  tlsn-wasm:
    name: tlsn_wasm bundle → release asset
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [verify-tag, checks]
    permissions:
      # Uploading a release asset is a contents write.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the bundle at the Cargo.lock tlsn rev
        run: ./scripts/build-tlsn-wasm.sh --out tlsn-wasm

      - name: Pack
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tar -czf "tlsn-wasm-$version.tar.gz" -C tlsn-wasm \
            tlsn_wasm.js tlsn_wasm_bg.wasm
          sha256sum "tlsn-wasm-$version.tar.gz"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: tlsn-wasm-*.tar.gz
