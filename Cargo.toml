[package]
name = "notary"
version = "0.3.0"
edition = "2021"
# The real floor, inherited from libid-rs (and the original monorepo before it):
#   * TLSNotary alpha.15's `mpz` graph declares Rust 1.95;
#   * the AWS SDK crates (via libid-signer) declare 1.94.1.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/notary"
description = "The libID notary service: MPC-TLS / zkTLS notarization of platform sessions and JWKS (OIDC) readings into one signed ceremony attestation, under one notary identity."
# A binary + companion library, never a registry crate: it names `tlsn`
# (git-only upstream) in its manifest, which cargo refuses to publish.
publish = false

[lib]
name = "notary"
path = "src/lib.rs"

[[bin]]
name = "notary"
path = "src/main.rs"

[dependencies]
# ── libid-rs shared crates ──────────────────────────────────────────────────
# All five ride the same git source, at the same pin, so their intra-workspace
# `path` deps unify. libid-tlsn is git-only (upstream tlsn is not on crates.io)
# and exposes sibling-crate types, so mixing the crates.io copies with the git
# copy would put two incompatible versions of the same types in the graph.
# libid-ceremony is the record the mock prover encodes, and also what
# libid-tlsn's attestation builder hands the server: one copy, or the two
# disagree on a type. The upstream `tlsn` git rev is pinned by libid-tlsn and
# arrives the same way; the direct `tlsn` entry below MUST name the same rev.
#
# A REV, NOT A TAG, AND ON PURPOSE. The ceremony wire constructions this server
# encodes live in libid-rs PR #2, and v0.3.0 does not exist yet. A tag that has
# not been cut resolves to nothing, so the pin below is a commit on that work
# instead: the head of `fix/origin-form-request-target`, stacked on the PR's
# branch. That commit is what makes `prover_generic` write the request-target
# in origin-form (`GET /oauth2/v3/certs HTTP/1.1`) -- the line
# `IdentityJwksRoots` and every Platform Verifier pin -- where the PR head
# alone writes the absolute URI and every Rust-prover session is refused on
# chain. This returns to `tag = "v0.3.0"` the moment the tag is cut -- and it
# must, before this is released: a rev is reachable only while the branch that
# carries it is, and squash-merging the PR would strand it.
libid-ceremony = { git = "https://github.com/libid-org/libid-rs", rev = "391078f2f05d1d3b6bce7c347db3c5f6a0cbe851" }
libid-crypto = { git = "https://github.com/libid-org/libid-rs", rev = "391078f2f05d1d3b6bce7c347db3c5f6a0cbe851" }
libid-signer = { git = "https://github.com/libid-org/libid-rs", rev = "391078f2f05d1d3b6bce7c347db3c5f6a0cbe851" }
libid-tlsn = { git = "https://github.com/libid-org/libid-rs", rev = "391078f2f05d1d3b6bce7c347db3c5f6a0cbe851" }
libid-transcript = { git = "https://github.com/libid-org/libid-rs", rev = "391078f2f05d1d3b6bce7c347db3c5f6a0cbe851" }

# Upstream TLSNotary. The pin MUST equal libid-tlsn's (same source →
# cargo unifies to one copy; a divergent rev would produce two incompatible
# `tlsn` crates and type errors at the libid-tlsn boundary). The wasm bundle
# script reads this pin back out of Cargo.lock so the browser prover can
# never drift onto a different tlsn version than the server.
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }

# ── server ──────────────────────────────────────────────────────────────────
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "signal",
    "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── JWKS mock prover ────────────────────────────────────────────────────────
# The caller-provided notary key the mock signs with. Same major as
# libid-crypto's, so the key type passes straight through.
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
# Plain-TLS JWKS fetch for the mock prover only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# The mock prover synthesizes the request bytes hyper puts on the wire, and
# one test drives hyper's own HTTP/1 encoder over an in-memory pipe to prove
# it. Both crates are already in the graph through libid-tlsn.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tlsn-sdk-core = { git = "https://github.com/libid-org/tlsn", rev = "816cebcf89480ebf55f58983ec6bab176ea08345" }
tlsn-server-fixture = { git = "https://github.com/libid-org/tlsn", rev = "816cebcf89480ebf55f58983ec6bab176ea08345" }
tlsn-server-fixture-certs = { git = "https://github.com/libid-org/tlsn", rev = "816cebcf89480ebf55f58983ec6bab176ea08345" }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29"

[patch."https://github.com/tlsnotary/tlsn"]
# WIP: TLSNotary #1178 reclaims the channel and #1179 preserves hash-opening
# order for multi-range commitments. Return to a release tag when both ship.
tlsn = { git = "https://github.com/libid-org/tlsn", rev = "816cebcf89480ebf55f58983ec6bab176ea08345" }
