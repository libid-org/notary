[package]
name = "notary"
version = "0.3.0"
edition = "2021"
# The real floor, inherited from libid-rs (and the original monorepo before it):
#   * TLSNotary alpha.15's `mpz` graph declares Rust 1.95;
#   * the AWS SDK crates (via libid-signer) declare 1.94.1.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/notary"
description = "The libID notary service: MPC-TLS / zkTLS notarization for platform sessions and notarized JWKS (OIDC) readings, under one notary identity."
# A binary + companion library, never a registry crate: it names `tlsn`
# (git-only upstream) in its manifest, which cargo refuses to publish.
publish = false

[lib]
name = "notary"
path = "src/lib.rs"

[[bin]]
name = "notary"
path = "src/main.rs"

[dependencies]
# ── libid-rs shared crates ──────────────────────────────────────────────────
# All five ride the same git source, at the same pin, so their intra-workspace
# `path` deps unify. libid-tlsn is git-only (upstream tlsn is not on crates.io)
# and exposes sibling-crate types, so mixing the crates.io copies with the git
# copy would put two incompatible versions of the same types in the graph.
# libid-ceremony arrives transitively through libid-tlsn, from the same pin.
# The upstream `tlsn` git rev is pinned by libid-tlsn and arrives the same way;
# the direct `tlsn` entry below MUST name the same rev.
#
# A REV, NOT A TAG, AND ON PURPOSE. The ceremony wire constructions this server
# encodes live in libid-rs PR #2, and v0.3.0 does not exist yet. A tag that has
# not been cut resolves to nothing, so the pin below is the head of that PR
# instead. This returns to `tag = "v0.3.0"` the moment the tag is cut -- and it
# must, before this is released: a rev is reachable only while the branch that
# carries it is, and squash-merging the PR would strand it.
libid-attestations = { git = "https://github.com/libid-org/libid-rs", rev = "239a4bb426ac72591fe30006f22660e164a98d96" }
libid-crypto = { git = "https://github.com/libid-org/libid-rs", rev = "239a4bb426ac72591fe30006f22660e164a98d96" }
libid-signer = { git = "https://github.com/libid-org/libid-rs", rev = "239a4bb426ac72591fe30006f22660e164a98d96" }
libid-tlsn = { git = "https://github.com/libid-org/libid-rs", rev = "239a4bb426ac72591fe30006f22660e164a98d96" }
libid-transcript = { git = "https://github.com/libid-org/libid-rs", rev = "239a4bb426ac72591fe30006f22660e164a98d96" }

# Upstream TLSNotary. The pin MUST equal libid-tlsn's (same source →
# cargo unifies to one copy; a divergent rev would produce two incompatible
# `tlsn` crates and type errors at the libid-tlsn boundary). The wasm bundle
# script reads this pin back out of Cargo.lock so the browser prover can
# never drift onto a different tlsn version than the server.
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }

# ── Solidity ABI mirrors (JwksOracle wire types) ────────────────────────────
alloy-primitives = { version = "1", features = ["serde"] }
alloy-sol-types = "1"

# ── server ──────────────────────────────────────────────────────────────────
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "signal",
    "time",
] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── JWKS role ───────────────────────────────────────────────────────────────
base64 = "0.22"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
# Plain-TLS JWKS fetch for the mock prover only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_with = { version = "3", features = ["hex"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tlsn-sdk-core = { git = "https://github.com/libid-org/tlsn", rev = "ab632378c35a30794dcbf1caecc3176450f4d0a1" }
tlsn-server-fixture = { git = "https://github.com/libid-org/tlsn", rev = "ab632378c35a30794dcbf1caecc3176450f4d0a1" }
tlsn-server-fixture-certs = { git = "https://github.com/libid-org/tlsn", rev = "ab632378c35a30794dcbf1caecc3176450f4d0a1" }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29"

[patch."https://github.com/tlsnotary/tlsn"]
# WIP: TLSNotary #1178 adds finish() so the browser can reclaim this same
# channel before reading the ceremony attestation. Return to the release tag
# when that PR ships.
tlsn = { git = "https://github.com/libid-org/tlsn", rev = "ab632378c35a30794dcbf1caecc3176450f4d0a1" }
